# Exp C 전용 compose 오버레이 — 제품 docker-compose.yml 은 수정하지 않는다.
#
# 목적: 비어 있는 model_cache 볼륨 대신 호스트 HF 캐시를 재사용한다.
#
# 왜 `hub` 하위를 마운트하는가:
#   llm/app.py:41, stt/app.py 등은 from_pretrained(..., cache_dir=HF_HOME) 로
#   HF_HOME 을 그대로 cache_dir 로 넘긴다. 그러나 HF 표준 레이아웃에서
#   모델 디렉터리는 $HF_HOME/hub/models--* 에 있고 cache_dir 는 그 `hub`
#   디렉터리를 가리켜야 한다. 빈 볼륨에서는 컨테이너가 직접
#   /app/model_cache/models--* 로 받아 우연히 동작하지만, 표준 HF_HOME 을
#   마운트하면 경로가 어긋나 "couldn't find it in the cached files" 로 실패한다.
#   (제품 코드 수정 없이 우회하기 위해) 호스트의 hub 디렉터리를
#   /app/model_cache 에 직접 바인드한다.
#
# 사용:
#   docker compose -f docker-compose.yml \
#                  -f paper_experiments/latency/docker-compose.latency.yml up -d llm stt
services:
  llm:
    volumes:
      - ${HOME}/.cache/huggingface/hub:/app/model_cache
    environment:
      HF_HOME: /app/model_cache
      HF_HUB_OFFLINE: "1"
  stt:
    volumes:
      - ${HOME}/.cache/huggingface/hub:/app/model_cache
    environment:
      HF_HOME: /app/model_cache
      HF_HUB_OFFLINE: "1"
  vlm:
    volumes:
      - ${HOME}/.cache/huggingface/hub:/app/model_cache
    environment:
      HF_HOME: /app/model_cache
      HF_HUB_OFFLINE: "1"
