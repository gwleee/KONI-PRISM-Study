# Compose overlay for Exp C only — the product docker-compose.yml is left unmodified.
#
# Purpose: reuse the host HF cache instead of the empty model_cache volume.
#
# Why mount the `hub` subdirectory:
#   llm/app.py:41, stt/app.py, etc. pass HF_HOME unchanged as cache_dir via
#   from_pretrained(..., cache_dir=HF_HOME). In the standard HF layout, however,
#   model directories live in $HF_HOME/hub/models--* and cache_dir must point to
#   that `hub` directory. With an empty volume the container downloads directly to
#   /app/model_cache/models--* and happens to work, but mounting a standard HF_HOME
#   misaligns the path and fails with "couldn't find it in the cached files".
#   (To work around this without modifying product code) the host hub directory
#   is bound directly to /app/model_cache.
#
# Usage:
#   docker compose -f docker-compose.yml \
#                  -f paper_experiments/latency/docker-compose.latency.yml up -d llm stt
services:
  llm:
    volumes:
      - ${HOME}/.cache/huggingface/hub:/app/model_cache
    environment:
      HF_HOME: /app/model_cache
      HF_HUB_OFFLINE: "1"
  stt:
    volumes:
      - ${HOME}/.cache/huggingface/hub:/app/model_cache
    environment:
      HF_HOME: /app/model_cache
      HF_HUB_OFFLINE: "1"
  vlm:
    volumes:
      - ${HOME}/.cache/huggingface/hub:/app/model_cache
    environment:
      HF_HOME: /app/model_cache
      HF_HUB_OFFLINE: "1"
