# Compose overlay for experiments only — the product docker-compose.yml is left unmodified.
#
# Why it is needed:
#   During long experiments Qdrant exhausted its file descriptors and died.
#     ERROR actix_server::accept: Too many open files (os error 24)
#     ERROR collection::update_handler: Failed to flush: ... RocksDB flush_cf error
#   Accumulating RocksDB segments exceeded the default nofile limit (1024).
#   Worse, the failure is silent — HMMRRetriever.retrieve() swallows per-tier
#   exceptions and returns empty results, so even if all retrievals fail the run
#   looks normal and yields values indistinguishable from a "no-memory config"
#   (this was in fact measured). We raise the limit and add a harness-side gate too.
services:
  qdrant:
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
